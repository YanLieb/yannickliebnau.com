name: Deploy Preprod
on:
  push:
    branches:
      - preprod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Diagnostic Secrets
        run: |
          if [ -z "${{ secrets.TS_OAUTH_CLIENT_ID }}" ]; then echo "ID is empty"; else echo "ID is set"; fi
          if [ -z "${{ secrets.TS_OAUTH_SECRET }}" ]; then echo "Secret is empty"; else echo "Secret is set"; fi

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /DATA/AppData/preprod.yannickliebnau.com
            git pull origin preprod
            docker compose up -d --build --force-recreate
